---
- name: Assert supported VM platform
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version("24.04", "==")
      - ansible_architecture == "x86_64"
    fail_msg: "Требуется Ubuntu Server 24.04 amd64"

- name: Find Ubuntu APT source files
  ansible.builtin.find:
    paths:
      - /etc/apt
    patterns:
      - sources.list
      - "*.list"
      - "*.sources"
    recurse: true
    depth: 2
    file_type: file
  register: ubuntu_apt_sources

- name: Replace the unavailable Ubuntu mirror with the primary archive
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: 'https?://at\.archive\.ubuntu\.com/ubuntu(?=/|\s|$)'
    replace: https://archive.ubuntu.com/ubuntu
  loop: "{{ ubuntu_apt_sources.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Install base packages and remote module dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssh-server
      - ufw
      - python3-debian
      - python3-requests
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker official repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: [stable]
    architectures: [amd64]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
